<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Échiquier</title>
<style>
  :root{
    --night:#070C13;
    --deep:#0E1722;
    --moon:#93B4CC;
    --lantern:#F0A63C;
    --bone:#EBE0CE;
    --dim:#7A8A98;
    --line:#1E2C3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--night)}
  body{
    color:var(--bone);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  canvas{display:block;width:100%;height:100%}

  #fallback{
    position:fixed;inset:0;display:none;place-items:center;padding:32px;
    text-align:center;color:var(--dim);font-size:15px;line-height:1.6;
  }

  /* ---------- barre principale ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:14px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(7,12,19,0) 0%,rgba(7,12,19,.82) 42%,rgba(7,12,19,.96) 100%);
  }
  .topbar{
    position:fixed;left:0;right:0;top:0;z-index:12;
    pointer-events:none;   /* le degrade ne doit pas voler les gestes du plateau */
    padding:calc(9px + env(safe-area-inset-top)) 16px 16px;
    background:linear-gradient(180deg,rgba(7,12,19,.95) 0%,rgba(7,12,19,.74) 52%,rgba(7,12,19,0) 100%);
  }
  .lamp{display:flex;align-items:center;gap:12px}
  #lampSlider{pointer-events:auto}
  /* ligne du jeu en ligne : volontairement effacee, on ne s'en sert que rarement */
  /* deux maillons discrets, cales a droite sous la lanterne */
  .netrow{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:8px}
  .netrow button{
    pointer-events:auto;
    flex:0 0 auto;width:38px;height:32px;display:grid;place-items:center;
    padding:0;background:none;border:0;color:var(--dim);
    -webkit-tap-highlight-color:transparent;cursor:pointer;
    transition:color .18s,transform .12s;
  }
  .netrow button svg{width:20px;height:20px;display:block}
  .netrow button:active{color:#F0A63C;transform:scale(.86)}
  .lamp b{
    font:400 11px/1 Georgia,serif;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);white-space:nowrap;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#25384A}
  input[type=range]::-moz-range-track{height:2px;background:#25384A}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--lantern);margin-top:-9px;border:none;
    box-shadow:0 0 12px rgba(240,166,60,.55);
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;background:var(--lantern);border:none;
  }
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  button{
    font:inherit;font-size:13px;color:var(--bone);cursor:pointer;
    background:rgba(30,44,58,.72);border:1px solid var(--line);border-radius:4px;
    padding:11px 4px;transition:background .14s;
  }
  button:active{background:rgba(48,68,88,.9)}
  button:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

  /* ---------- panneaux ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:#0C141E;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(101%);transition:transform .26s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open{transform:none}
  .veil{
    position:fixed;inset:0;z-index:19;background:rgba(4,7,11,.55);
    opacity:0;pointer-events:none;transition:opacity .26s;
  }
  .veil.open{opacity:1;pointer-events:auto}
  .sheet h2{
    font:400 20px/1.2 Georgia,"Times New Roman",serif;margin:0 0 3px;
  }
  .sheet .note{color:var(--dim);font-size:13px;margin:0 0 20px}
  .grp{
    font:400 11px/1 Georgia,serif;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line);
  }
  .grp:first-of-type{margin-top:0}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .on{background:rgba(240,166,60,.16);border-color:var(--lantern);color:#FFD9A0}
  .danger{color:#E08A7A}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0 4px}
  .row span{font-size:14px;white-space:nowrap}
  .val{color:var(--lantern);font-variant-numeric:tabular-nums;font-size:13px}
  .tm{display:flex;flex-direction:column;gap:6px;font:400 11px/1 Georgia,serif;
      letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
  .tm input{font:inherit;font-size:18px;font-family:ui-monospace,Menlo,monospace;
      color:var(--bone);background:#08101A;border:1px solid var(--line);border-radius:4px;
      padding:11px 4px;text-align:center;width:100%;-moz-appearance:textfield}
  .tm input::-webkit-outer-spin-button,.tm input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .check{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;margin:18px 0 4px}
  .check input{accent-color:var(--lantern);width:18px;height:18px}
  .wide{width:100%;margin-top:9px}
  .log{
    font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#B9C9D6;background:#08101A;border:1px solid var(--line);border-radius:4px;
    padding:12px 13px;max-height:34vh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  .empty{color:#4E5E6C;font-style:italic}

  /* ---------- bannière ---------- */
  .banner{
    position:fixed;left:12px;right:12px;top:calc(66px + env(safe-area-inset-top));z-index:15;
    display:none;align-items:center;gap:12px;
    background:rgba(14,23,34,.95);border:1px solid var(--line);border-radius:5px;
    padding:11px 13px;font-size:13.5px;
  }
  .banner.show{display:flex}
  .banner span{flex:1;color:var(--dim)}
  .banner button{padding:7px 12px;font-size:13px}

  .toast{
    position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);z-index:30;
    background:rgba(14,23,34,.96);border:1px solid var(--line);border-radius:4px;
    padding:10px 16px;font-size:13.5px;color:var(--bone);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="acts">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.getElementById('fallback').style.display = 'grid';
} else {
buildApp();
}

function buildApp(){
'use strict';

/* ======================================================================
   ÉTAT
   ====================================================================== */
const NAMES = { k:'Roi', q:'Dame', r:'Tour', b:'Fou', n:'Cavalier', p:'Pion' };
const ORDER = ['k','q','r','b','n','p'];

const settings = { lamp:45, sea:26, fx:70, swell:true, side:'w', clock:{ h:0, m:10, s:0 } };
let mySide = 'w';                 // le camp du joueur assis pres de la camera
const other = c => c === 'w' ? 'b' : 'w';
let pieces = [];          // { type, color, f, r, grp }
let journal = [];         // lignes de texte
let history = [];         // pile d'annulation
let moveNo = 1, lastColor = null, startFen = null;
let plyCount = 0;
let dirtyExport = false;

const store = {
  async get(k){
    try { const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  },
  async set(k, v){
    try { await window.storage.set(k, JSON.stringify(v)); } catch(e){}
  }
};

/* ======================================================================
   SON  (repris du banc d'essai validé)
   ====================================================================== */
let ctx, master, seaBus, fxBus, swellBus, noiseBuf;
let seaOn = false, crackleTimer = null, swellTimer = null, swellAmt = .5;

// iOS coupe le son des pages web quand l'interrupteur de sourdine est actif.
// Faire jouer un element audio silencieux en boucle bascule la session audio
// en mode lecture, et le son de la page echappe alors a cet interrupteur.
let silentEl = null;
function unlockAudio(){
  if (silentEl) return;
  silentEl = document.createElement('audio');
  silentEl.setAttribute('playsinline', '');
  silentEl.loop = true;
  silentEl.volume = .001;
  silentEl.src = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
  const p = silentEl.play();
  if (p && p.catch) p.catch(() => {});
}

function boot(){
  unlockAudio();
  if (ctx){ if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = .003;
  master = ctx.createGain(); master.gain.value = .9;
  master.connect(comp); comp.connect(ctx.destination);
  seaBus = ctx.createGain(); seaBus.gain.value = settings.sea / 100;
  fxBus  = ctx.createGain(); fxBus.gain.value  = settings.fx / 100;
  seaBus.connect(master); fxBus.connect(master);

  const len = ctx.sampleRate * 4;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    last = (last + .02 * w) / 1.02;
    d[i] = last * 3.4;
  }
}
const rnd = (a, b) => a + Math.random() * (b - a);

function burst(dest, o){
  const t = ctx.currentTime + (o.delay || 0);
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf; s.playbackRate.value = rnd(.9, 1.1);
  const f = ctx.createBiquadFilter();
  f.type = o.type || 'bandpass'; f.frequency.value = o.freq; f.Q.value = o.q || 1;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, o.gain), t + .0025);
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 3); s.stop(t + o.dur + .05);
}
function mode(dest, o){
  const t = ctx.currentTime + (o.delay || 0);
  const osc = ctx.createOscillator();
  osc.type = 'sine'; osc.frequency.value = o.freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002, o.gain), t + .002);
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + o.dur + .05);
}

let seaNodes = [];
function startSea(){
  if (seaOn) return;
  boot(); seaOn = true;
  swellBus = ctx.createGain(); swellBus.gain.value = .6; swellBus.connect(seaBus);
  const mk = (type, freq, q, gain) => {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(swellBus);
    s.start(Math.random() * 3); seaNodes.push(s);
    return { f, g };
  };
  const bed  = mk('bandpass', 760, .55, .22);
  const hiss = mk('bandpass', 3400, .5, .055);
  const lfo = (rate, depth, target) => {
    const o = ctx.createOscillator(); o.frequency.value = rate;
    const g = ctx.createGain(); g.gain.value = depth;
    o.connect(g); g.connect(target); o.start(); seaNodes.push(o);
  };
  lfo(.11, 120, bed.f.frequency);
  lfo(.29, .07, bed.g.gain);
  lfo(.17, .018, hiss.g.gain);

  // la vague : montée franche sur le premier tiers, retrait long sur le reste
  let phase = .5, period = rnd(7.5, 12), t0 = performance.now();
  swellTimer = setInterval(() => {
    const now = performance.now(), dt = (now - t0) / 1000; t0 = now;
    if (!settings.swell){
      swellAmt = .5;
      swellBus.gain.setTargetAtTime(.6, ctx.currentTime, .3);
      bed.f.frequency.setTargetAtTime(760, ctx.currentTime, .3);
      return;
    }
    phase += dt / period;
    if (phase >= 1){ phase -= 1; period = rnd(7.5, 12); }
    swellAmt = phase < .32
      ? Math.pow(Math.sin(phase / .32 * Math.PI / 2), 1.1)
      : Math.pow(Math.cos((phase - .32) / .68 * Math.PI / 2), 1.7);
    swellBus.gain.setTargetAtTime(.22 + swellAmt * .95, ctx.currentTime, .12);
    bed.f.frequency.setTargetAtTime(600 + swellAmt * 900, ctx.currentTime, .18);
  }, 60);
  crackle();
}
function crackle(){
  if (!seaOn) return;
  const k = .3 + swellAmt * 1.15, r = Math.random();
  if (r < .04){
    burst(seaBus, { freq: rnd(520,1000), q:1.6, dur: rnd(.04,.08), gain: rnd(.3,.55)*k });
    burst(seaBus, { freq: 6000, q:.5, type:'highpass', dur:.012, gain:.3*k });
  } else if (r < .26){
    burst(seaBus, { freq: rnd(1900,3600), q:1.8, dur: rnd(.014,.035), gain: rnd(.16,.34)*k });
  } else {
    burst(seaBus, { freq: rnd(3600,8200), q:2.4, dur: rnd(.004,.014), gain: rnd(.08,.24)*k });
    if (Math.random() < .35)
      burst(seaBus, { freq: rnd(4200,9000), q:2.4, dur:.007, gain: rnd(.06,.18)*k, delay: rnd(.012,.05) });
  }
  crackleTimer = setTimeout(crackle, rnd(16,165) / (.4 + swellAmt * .9));
}
function stopSea(){
  seaOn = false;
  clearTimeout(crackleTimer); clearInterval(swellTimer); swellAmt = .5;
  seaNodes.forEach(n => { try { n.stop(); } catch(e){} });
  seaNodes = [];
}

function feltDrop(){
  boot();
  const p = rnd(.93, 1.08);
  burst(fxBus, { freq: 950*p, q:.7, type:'lowpass', dur:.055, gain:.4 });
  mode(fxBus, { freq: 108*p, dur:.1, gain:.26 });
  mode(fxBus, { freq: 290*p, dur:.05, gain:.07 });
}
// iOS gele les pages en arriere-plan : on suspend le decompte plutot que de
// laisser le temps filer a l'insu des joueurs, et on reprend au retour.
let clockWasRunning = null;
// Frottement d'une piece poussee hors de sa case.
function slideSound(){
  boot();
  const t = ctx.currentTime, dur = rnd(.15, .22);
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf; src.playbackRate.value = rnd(.85, 1.15);
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = 1.6;
  f.frequency.setValueAtTime(900, t);
  f.frequency.linearRampToValueAtTime(1600, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.24, t + .04);
  g.gain.setValueAtTime(.24, t + dur * .6);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(fxBus);
  src.start(t, Math.random() * 3); src.stop(t + dur + .05);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (clockState.active){ clockWasRunning = clockState.active; pauseClock(); persist(); }
  } else if (clockWasRunning){
    clockState.active = clockWasRunning; clockState.since = Date.now();
    clockWasRunning = null;
    clockTick(performance.now(), true);
  }
  if (!ctx) return;
  if (document.hidden){ ctx.suspend(); }
  else {
    ctx.resume();
    if (silentEl){ const p = silentEl.play(); if (p && p.catch) p.catch(() => {}); }
  }
});

/* ======================================================================
   SCÈNE
   ====================================================================== */
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, .6, 260);

// --- ciel nocturne peint à la main, réutilisé comme carte d'environnement
function skyTexture(){
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0,   '#03060C');
  grd.addColorStop(.34, '#081522');
  grd.addColorStop(.49, '#173247');   // lueur d'horizon
  grd.addColorStop(.52, '#0B1826');
  grd.addColorStop(1,   '#050A10');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
  // lune et son halo
  const mx = 660, my = 150;
  const halo = g.createRadialGradient(mx, my, 4, mx, my, 190);
  halo.addColorStop(0, 'rgba(190,215,235,.55)');
  halo.addColorStop(.16, 'rgba(130,170,205,.16)');
  halo.addColorStop(1, 'rgba(120,160,200,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(mx, my, 190, 0, 7); g.fill();
  g.fillStyle = '#E4EEF6'; g.beginPath(); g.arc(mx, my, 17, 0, 7); g.fill();
  // quelques étoiles, discrètes
  for (let i = 0; i < 190; i++){
    const x = Math.random() * 1024, y = Math.random() * 210;
    g.fillStyle = 'rgba(200,220,240,' + (Math.random() * .5 + .12) + ')';
    g.fillRect(x, y, 1.4, 1.4);
  }
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const sky = skyTexture();
scene.background = sky;
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(sky).texture;

// --- lumières : chaud sur le plateau, froid au fond
const lantern = new THREE.PointLight(0xffb877, 1, 26, 2);
lantern.position.set(2.4, 5.4, 3.2);
lantern.castShadow = true;
lantern.shadow.mapSize.set(innerWidth < 500 ? 512 : 1024, innerWidth < 500 ? 512 : 1024);
lantern.shadow.bias = -.0016;

  return pieces.filter(k => k.type === 'k' &&
    pieces.some(o => o.color !== k.color && reaches(o, k.f, k.r, map)));

  if (typeof pieces === 'undefined') return;
  const ks = kingsInCheck();
  ks.forEach((k, i) => {

const litMat = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const g = c.getContext('2d');
  // carre a bords fondus : lumiere posee sur la case, sans arete franche
  const grd = g.createRadialGradient(48, 48, 6, 48, 48, 52);
  grd.addColorStop(0,   'rgba(168,214,255,.95)');
  grd.addColorStop(.62, 'rgba(140,196,250,.74)');
  grd.addColorStop(.88, 'rgba(120,180,242,.24)');
  grd.addColorStop(1,   'rgba(110,172,238,0)');
  g.fillStyle = grd;
  const rr = (x, y, w, h, r) => {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill();
  };
  rr(4, 4, 88, 88, 16);
  return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    opacity: .40 });

})();

function makePiece(type, color){
  const mat = color === 'w' ? matLight : matDark;
  const grp = new THREE.Group();

  const felt = new THREE.Mesh(feltGeo, matFelt);
  felt.position.y = FELT_H / 2;
  grp.add(felt);

  const body = new THREE.Mesh(bodyGeo(type), mat);
  grp.add(body);

  const extras = [];
  if (type === 'r'){
    for (let i = 0; i < 8; i++){
      const a = i / 8 * Math.PI * 2;
      const m = new THREE.Mesh(merlonGeo, mat);
      m.position.set(Math.cos(a) * .205, .66 + FELT_H + .05, Math.sin(a) * .205);
      m.rotation.y = -a;
      extras.push(m);
    }
  } else if (type === 'n'){
    const h = new THREE.Mesh(knightGeo, mat);
    h.scale.setScalar(.95);
    h.position.y = .225 + FELT_H + .265;
    h.rotation.y = color === 'w' ? 0 : Math.PI;
    extras.push(h);
  } else if (type === 'b'){
    const m = new THREE.Mesh(crownGeo, mat);
    m.position.y = .80 + FELT_H + .04;
    extras.push(m);
  } else if (type === 'q'){
    for (let i = 0; i < 9; i++){
      const a = i / 9 * Math.PI * 2;
      const m = new THREE.Mesh(crownGeo, mat);
      m.position.set(Math.cos(a) * .205, .80 + FELT_H + .015, Math.sin(a) * .205);
      extras.push(m);
    }
    const o = new THREE.Mesh(orbGeo, mat);
    o.position.y = .80 + FELT_H + .06;
    extras.push(o);
  } else if (type === 'k'){
    const a = new THREE.Mesh(crossV, mat);
    a.position.y = .84 + FELT_H + .105;
    const b = new THREE.Mesh(crossH, mat);
    b.position.y = .84 + FELT_H + .145;
    extras.push(a, b);
  }
  extras.forEach(m => grp.add(m));

  grp.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return grp;
}

function squarePos(f, r){ return { x: f - 3.5, z: 3.5 - r }; }

// Deplacement effectif, quelle que soit la maniere dont il a ete demande.
function commitMove(pc, f, r){
  const q = squarePos(f, r);
  if (pc.f === f && pc.r === r){ pc.grp.position.set(q.x, 0, q.z); return false; }

  if (startFen === null) startFen = fen();   // position de depart, figee au premier coup
  let notation = san(pc, f, r);
  const snap = { mn: moveNo, lc: lastColor };

  // Un roque n'est un roque que si la tour est la : sinon c'est un simple coup de roi.
  let rookMove = null;
  if (notation === 'O-O' || notation === 'O-O-O'){
    const rf = notation === 'O-O' ? 7 : 0;
    const rk = pieceAt(rf, pc.r);
    if (rk && rk.type === 'r' && rk.color === pc.color){
      rookMove = { pc: rk, from: { f: rf, r: pc.r }, to: { f: notation === 'O-O' ? 5 : 3, r: pc.r } };
    } else {
      notation = 'K' + sqName(f, r);
    }
  }

  const occ = pieceAt(f, r);
  const cap = occ && occ !== pc ? { t: occ.type, c: occ.color, f: f, r: r } : null;
  const from = { f: pc.f, r: pc.r };
  if (cap){
    // la piece prise part dans le sens ou l'assaillant l'a poussee
    const d = new THREE.Vector3(f - from.f, 0, from.r - r);
    if (d.lengthSq() === 0) d.set(0, 0, 1);
    d.normalize().applyQuaternion(board.quaternion);
    capturePiece(occ, d);
  }
  pc.f = f; pc.r = r;
  pc.grp.position.set(q.x, 0, q.z);

  if (rookMove){                       // la tour suit le roi d'elle-meme
    const rq = squarePos(rookMove.to.f, rookMove.to.r);
    rookMove.pc.f = rookMove.to.f; rookMove.pc.r = rookMove.to.r;
    rookMove.pc.grp.position.set(rq.x, 0, rq.z);
  }

  // l'echec se lit sur la position d'arrivee, pas sur celle de depart
  if (kingsInCheck().some(k => k.color !== pc.color)) notation += '+';

  feltDrop();
  logMove(pc, notation);
  history.push({ k:'move', from: from, to:{ f: f, r: r }, cap: cap,
                 rook: rookMove ? { from: rookMove.from, to: rookMove.to } : null,
                 mn: snap.mn, lc: snap.lc });
  shadowsDirty(); persist();
  return true;
}

function addPiece(type, color, f, r){
  const grp = makePiece(type, color);
  const p = squarePos(f, r);
  grp.position.set(p.x, 0, p.z);
  board.add(grp);
  const obj = { type, color, f, r, grp };
  grp.userData.piece = obj;
  pieces.push(obj);
  return obj;
}
function removePiece(obj){
  if (selected === obj) deselect();
  board.remove(obj.grp);
  pieces = pieces.filter(p => p !== obj);
}
function pieceAt(f, r){ return pieces.find(p => p.f === f && p.r === r); }

function clearBoard(){
  pieces.slice().forEach(removePiece);
}
function standardSetup(){
  clearBoard();
  const back = ['r','n','b','q','k','b','n','r'];
  for (let f = 0; f < 8; f++){
    addPiece(back[f], 'w', f, 0);
    addPiece('p', 'w', f, 1);
    addPiece('p', 'b', f, 6);
    addPiece(back[f], 'b', f, 7);
  }
}

const GY_X = -5.75, GY_Y = -.465, GY_STEP = .52;
const PUSH_MS = 200, FLY_MS = 620;
let captured = [], capFlights = [];

const graveMat = new THREE.Mesh(
  new THREE.PlaneGeometry(1.9, 8.6),
  new THREE.MeshStandardMaterial({ color: 0x2B1519, roughness: .98, metalness: 0 })

graveMat.receiveShadow = true;

// Une piece prise revient a celui qui l'a prise : elle s'entasse donc du cote
// du camp adverse au sien.
function graveSlot(color, i){
  const sign = other(color) === mySide ? 1 : -1;
  const col = i % 3, row = Math.min(12, Math.floor(i / 3));
  return { x: GY_X + (col - 1) * GY_STEP, y: GY_Y, z: sign * (.62 + row * GY_STEP) };
}

const _wp = new THREE.Vector3(), _wq = new THREE.Quaternion();
function detachToWorld(grp){
  board.updateMatrixWorld();
  grp.getWorldPosition(_wp); grp.getWorldQuaternion(_wq);
  board.remove(grp); scene.add(grp);
  grp.position.copy(_wp); grp.quaternion.copy(_wq);
}

function capturePiece(occ, dirWorld){
  if (selected === occ) deselect();
  pieces = pieces.filter(x => x !== occ);
  detachToWorld(occ.grp);
  const idx = captured.filter(e => e.color === occ.color).length;
  const slot = graveSlot(occ.color, idx);
  captured.push({ type: occ.type, color: occ.color, grp: occ.grp, slot: slot });
  capFlights.push({
    grp: occ.grp, slot: slot, t0: performance.now(),
    start: occ.grp.position.clone(),
    push: occ.grp.position.clone().addScaledVector(dirWorld, .92),
    q0: occ.grp.quaternion.clone()
  });
  slideSound();
}

function unbury(){
  const e = captured.pop();
  if (!e) return;
  capFlights = capFlights.filter(f => f.grp !== e.grp);
  scene.remove(e.grp);
}
function clearGrave(){
  captured.forEach(e => scene.remove(e.grp));
  capFlights = []; captured = [];
}
function relayoutGrave(){
  const n = { w: 0, b: 0 };
  captured.forEach(e => {
    e.slot = graveSlot(e.color, n[e.color]++);
    if (!capFlights.some(f => f.grp === e.grp))
      e.grp.position.set(e.slot.x, e.slot.y, e.slot.z);
  });
}
function restoreGrave(list){
  clearGrave();
  const n = { w: 0, b: 0 };
  (list || []).forEach(o => {
    const grp = makePiece(o.t, o.c);
    const slot = graveSlot(o.c, n[o.c]++);
    grp.position.set(slot.x, slot.y, slot.z);
    scene.add(grp);
    captured.push({ type: o.t, color: o.c, grp: grp, slot: slot });
  });
}

const _idq = new THREE.Quaternion();
function stepFlights(now){
  if (!capFlights.length) return false;
  for (let i = capFlights.length - 1; i >= 0; i--){
    const fl = capFlights[i], t = now - fl.t0;
    if (t < PUSH_MS){
      const k = t / PUSH_MS;
      fl.grp.position.lerpVectors(fl.start, fl.push, 1 - Math.pow(1 - k, 2));
    } else if (t < PUSH_MS + FLY_MS){
      const k = (t - PUSH_MS) / FLY_MS;
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      fl.grp.position.x = fl.push.x + (fl.slot.x - fl.push.x) * e;
      fl.grp.position.z = fl.push.z + (fl.slot.z - fl.push.z) * e;
      fl.grp.position.y = fl.push.y + (fl.slot.y - fl.push.y) * Math.min(1, e * 1.4);
      fl.grp.quaternion.copy(fl.q0).slerp(_idq, e);   // methode presente des r128
    } else {
      fl.grp.position.set(fl.slot.x, fl.slot.y, fl.slot.z);
      fl.grp.quaternion.copy(_idq);
      capFlights.splice(i, 1);
      feltDrop();
    }
  }
  return true;
}

(function buildClock(){
  const wood  = new THREE.MeshStandardMaterial({ color: 0x3B2517, roughness: .52, metalness: .05 });
  const brass = new THREE.MeshStandardMaterial({ color: 0xC9A055, roughness: .28, metalness: .88 });

  // Boitier en pupitre, aligne sur le bord du plateau : haut a l'arriere,
  // bas vers le joueur, pour que la face se presente au regard.
  const prof = new THREE.Shape();
  prof.moveTo(-1.35, 0); prof.lineTo(1.35, 0);
  prof.lineTo(1.35, 1.32); prof.lineTo(-1.35, .72);
  prof.closePath();
  const bg = new THREE.ExtrudeGeometry(prof, {
    depth: 1.75, bevelEnabled: true, bevelSize: .03, bevelThickness: .03, bevelSegments: 1
  });
  bg.translate(0, 0, -.875);
  bg.rotateY(Math.PI / 2);
  bg.computeVertexNormals();
  const body = new THREE.Mesh(bg, wood);
  clockGrp.add(body);

  const plinth = new THREE.Mesh(new THREE.BoxGeometry(1.92, .10, 2.86), wood);
  plinth.position.y = .04;
  clockGrp.add(plinth);

  const SLOPE = -(Math.PI / 2 - .2187);   // pente exacte du dessus du pupitre
  const bez = new THREE.Mesh(new THREE.PlaneGeometry(1.76, 2.26), brass);
  bez.rotation.x = SLOPE; bez.position.set(0, 1.046, 0);
  clockGrp.add(bez);

  // Le cadran s'eclaire lui-meme : il reste lisible lanterne baissee, et il est
  // tenu hors du calcul des ombres pour qu'il ne s'assombrisse pas tout seul.
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(1.60, 2.10),
    new THREE.MeshStandardMaterial({
      map: clkTex, emissive: 0xffffff, emissiveMap: clkTex, emissiveIntensity: .72,
      roughness: .6, metalness: 0
    })
  );
  face.rotation.x = SLOPE; face.position.set(0, 1.062, 0);
  clockGrp.add(face);

  // Un piston du cote de chaque joueur : l'avant pour les clairs, l'arriere
  // pour les sombres. Celui du camp qui decompte reste leve.
  const plungerGeo = new THREE.CylinderGeometry(.125, .125, .22, 16);
  plungerFront = new THREE.Mesh(plungerGeo, brass);
  plungerFront.position.set(0, .866, 1.19);
  clockGrp.add(plungerFront);
  plungerBack = new THREE.Mesh(plungerGeo, brass);
  plungerBack.position.set(0, 1.394, -1.19);
  clockGrp.add(plungerBack);

  clockGrp.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  face.castShadow = false; face.receiveShadow = false;
  bez.castShadow = false; bez.receiveShadow = false;
})();

const clockState = { w: 0, b: 0, active: null, since: 0 };
const shownChars = { w: null, b: null };
const flips = { w: {}, b: {} };

function clockTotalMs(){
  const c = settings.clock;
  return ((c.h * 3600) + (c.m * 60) + c.s) * 1000;
}
function remaining(side){
  let ms = clockState[side];
  if (clockState.active === side) ms -= (Date.now() - clockState.since);
  return Math.max(0, ms);
}
function fmt(ms){
  const t = Math.ceil(ms / 1000);
  return Math.floor(t / 3600) + ':' +
         String(Math.floor(t % 3600 / 60)).padStart(2, '0') + ':' +
         String(t % 60).padStart(2, '0');
}
function resetClock(){
  clockState.w = clockState.b = clockTotalMs();
  clockState.active = null; clockState.paused = null; clockState.since = 0;
  shownChars.w = shownChars.b = null;
  flips.w = {}; flips.b = {};
}
function pauseClock(){
  if (!clockState.active) return;
  clockState[clockState.active] = remaining(clockState.active);
  clockState.paused = clockState.active;
  clockState.active = null;
}
function pressClock(){
  if (clockState.active){
    clockState[clockState.active] = remaining(clockState.active);
    clockState.active = clockState.active === 'w' ? 'b' : 'w';
  } else {
    clockState.active = clockState.paused || 'w';   // sinon on demarre par les clairs
  }
  clockState.paused = null;
  clockState.since = Date.now();
  if (remaining(clockState.active) <= 0) clockState.active = null;
  feltDrop(); clockTick(performance.now(), true); persist();
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function halfDigit(g, ch, x, y, w, h, top){
  g.save();
  g.beginPath();
  if (top) g.rect(x, y, w, h / 2 - 1.5); else g.rect(x, y + h / 2 + 1.5, w, h / 2);
  g.clip();
  g.fillStyle = '#EFE4D0';
  g.font = '700 ' + Math.round(h * .8) + 'px ui-monospace, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, x + w / 2, y + h / 2 + h * .025);
  g.restore();
}
// Volet a bascule : la moitie haute tombe en montrant l'ancien chiffre,
// puis se releve en montrant le nouveau.
function card(g, x, y, w, h, ch, fl, now){
  g.fillStyle = '#181310'; roundRect(g, x, y, w, h, 9); g.fill();
  const k = fl ? Math.min(1, (now - fl.t0) / FLIP_MS) : null;
  halfDigit(g, ch, x, y, w, h, true);
  halfDigit(g, (k !== null && k < 1) ? fl.from : ch, x, y, w, h, false);
  if (k !== null && k < 1){
    const mid = y + h / 2;
    g.save();
    g.beginPath();
    if (k < .5) g.rect(x, y, w, h / 2); else g.rect(x, mid, w, h / 2);
    g.clip();
    g.translate(0, mid); g.scale(1, k < .5 ? 1 - k * 2 : (k - .5) * 2); g.translate(0, -mid);
    g.fillStyle = '#1E1712'; roundRect(g, x, y, w, h, 9); g.fill();
    halfDigit(g, k < .5 ? fl.from : ch, x, y, w, h, k < .5);
    g.restore();
  }
  g.fillStyle = 'rgba(0,0,0,.8)';
  g.fillRect(x, y + h / 2 - 1.5, w, 3);
}
// Emblemes : disque clair pour les blancs, disque sombre cercle de clair
// pour les noirs. Un anneau ambre entoure le camp dont le temps s'ecoule.
function emblem(side, cx, cy){
  const act = clockState.active === side;
  if (act){
    cg.strokeStyle = '#E9A63F'; cg.lineWidth = 4;
    cg.beginPath(); cg.arc(cx, cy, 30, 0, 7); cg.stroke();
  }
  cg.fillStyle = side === 'w' ? '#EFE4D0' : '#141010';
  cg.beginPath(); cg.arc(cx, cy, 19, 0, 7); cg.fill();
  cg.strokeStyle = side === 'w' ? '#3A322A' : '#CFC2AC'; cg.lineWidth = 3;
  cg.beginPath(); cg.arc(cx, cy, 19, 0, 7); cg.stroke();
}
function drawRow(side, y, now){
  const txt = shownChars[side] || '0:00:00';
  emblem(side, 46, y + 34);
  cg.fillStyle = '#7A6C5C';
  cg.font = '400 20px Georgia, serif';
  cg.textAlign = 'left'; cg.textBaseline = 'middle';
  cg.fillText(side === 'w' ? 'CLAIRS' : 'SOMBRES', 82, y + 35);
  let x = 21;
  const top = y + 75;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (ch === ':'){
      cg.fillStyle = '#6E6153';
      cg.beginPath(); cg.arc(x + 12, top + 42, 5, 0, 7); cg.fill();
      cg.beginPath(); cg.arc(x + 12, top + 88, 5, 0, 7); cg.fill();
      x += 29;
    } else {
      card(cg, x, top, 60, 130, ch, flips[side][i], now);
      x += 65;
    }
  }
}
function drawClockFace(now){
  cg.fillStyle = '#0B0906'; cg.fillRect(0, 0, CLK_W, CLK_H);
  // Le haut de la toile se projette a l'arriere du pupitre : c'est le temps
  // de l'adversaire. Le bas revient au joueur assis pres de la camera.
  drawRow(other(mySide), 26, now);
  cg.fillStyle = '#241D16'; cg.fillRect(20, 272, CLK_W - 40, 2);
  drawRow(mySide, 302, now);
  clkTex.needsUpdate = true;
}
function setSideText(side, txt, now){
  const prev = shownChars[side];
  if (prev === txt) return false;
  if (prev){
    for (let i = 0; i < txt.length; i++)
      if (prev[i] !== txt[i] && txt[i] >= '0' && txt[i] <= '9')
        flips[side][i] = { from: prev[i], to: txt[i], t0: now };
  }
  shownChars[side] = txt;
  return true;
}
function anyFlip(now){
  let live = false;
  ['w','b'].forEach(side => {
    Object.keys(flips[side]).forEach(i => {
      if (now - flips[side][i].t0 < FLIP_MS) live = true;
      else delete flips[side][i];
    });
  });
  return live;
}
function setPlungers(){
  if (!plungerFront) return;
  const a = clockState.active;
  plungerFront.position.y = .866 + (a === other(mySide) ? -.055 : .015);
  plungerBack.position.y  = 1.394 + (a === mySide ? -.055 : .015);
}
function clockTick(now, force){
  if (clockState.active && remaining(clockState.active) <= 0){
    clockState[clockState.active] = 0;
    clockState.active = null;
    force = true;
  }
  let changed = !!force;
  if (setSideText('w', fmt(remaining('w')), now)) changed = true;
  if (setSideText('b', fmt(remaining('b')), now)) changed = true;
  const live = anyFlip(now);
  if (changed || live){
    if (changed) setPlungers();
    drawClockFace(now); needsRender = true;
  }
}

/* ======================================================================
   CAMÉRA ORBITALE
   ====================================================================== */
// La camera ne bouge plus : c'est le plateau qui pivote sur la table,
// ce qui laisse l'horloge et les pieces prises immobiles a l'ecran.
const cam = { side: 0, theta: Math.PI / 2, phi: .78, dist: 22, def: 22, target: new THREE.Vector3(0, 0, 0) };
function applyCam(){
  cam.dist = Math.max(8, Math.min(cam.def * 1.7, cam.dist));
  camera.position.set(
    cam.target.x + cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta),
    cam.target.y + cam.dist * Math.cos(cam.phi),
    cam.target.z + cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)
  );
  camera.lookAt(cam.target);
  needsRender = true;
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < .72 ? 46 : 38;
  camera.updateProjectionMatrix();
  // recul juste suffisant pour que l'affichage de l'horloge entre en entier
  const prev = cam.def;
  cam.def = Math.max(11, Math.min(32,
    6.6 / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect)));
  cam.dist = prev ? cam.dist * (cam.def / prev) : cam.def;
  applyCam();
}
addEventListener('resize', resize);

let turning = null;
function turnTo(dir){
  if (turning) return;
  cam.side = (cam.side + dir + 4) % 4;
  turning = { from: board.rotation.y, to: board.rotation.y + dir * Math.PI / 2, t0: performance.now() };
  requestAnimationFrame(tick);
}
function quarterTurn(){ turnTo(1); }

// Place le joueur de son cote : son camp au bord proche, cadran et pistons
// permutes en consequence.
function orientSide(){
  turning = null;
  board.rotation.y = mySide === 'b' ? Math.PI : 0;
  cam.side = mySide === 'b' ? 2 : 0;
  relayoutGrave();
  clockTick(performance.now(), true);
  shadowsDirty();
}
function applySide(announce){
  mySide = settings.side === 'random' ? (Math.random() < .5 ? 'w' : 'b') : settings.side;
  orientSide();
  if (announce) toast('Tu joues les ' + (mySide === 'w' ? 'clairs' : 'sombres'));
}

/* ======================================================================
   INTERACTION
   ====================================================================== */
const ray = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2();
const hitPt = new THREE.Vector3();

let mode2 = null;          // 'orbit' | 'drag'
let dragged = null, dragMoved = 0, downXY = null, origin = null;
let swipeDX = 0;
let pinch = null;

// l'edition ne s'ouvre qu'au double appui, pour ne plus la declencher par megarde
let lastTap = { key: '', t: 0 };
function isDoubleTap(key){
  const now = performance.now();
  if (lastTap.key === key && now - lastTap.t < 400){ lastTap = { key: '', t: 0 }; return true; }
  lastTap = { key: key, t: now };
  return false;
}

function toNdc(x, y){
  ndc.x = (x / innerWidth) * 2 - 1;
  ndc.y = -(y / innerHeight) * 2 + 1;
}
function groundPoint(x, y){
  toNdc(x, y);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(plane, hitPt) ? hitPt.clone() : null;
}
// Le plateau tournant, un point du sol doit etre ramene dans son repere
// avant d'en deduire une case.
const _lp = new THREE.Vector3();
function boardPoint(x, y){
  const g = groundPoint(x, y);
  if (!g) return null;
  board.updateMatrixWorld();
  return board.worldToLocal(_lp.copy(g));
}
function pickClock(x, y){
  toNdc(x, y);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(clockGrp, true).length > 0;
}
function pickPiece(x, y){
  toNdc(x, y);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pieces.map(p => p.grp), true);
  if (!hits.length) return null;
  let o = hits[0].object;
  while (o && !o.userData.piece) o = o.parent;
  return o ? o.userData.piece : null;
}

cv.addEventListener('pointerdown', e => {
  boot();
  clearLit();          // le geste du joueur eteint le signal de l'adversaire
  if (!seaOn && settings.sea > 0) startSea();
  cv.setPointerCapture(e.pointerId);
  downXY = { x: e.clientX, y: e.clientY };
  dragMoved = 0;
  if (pickClock(e.clientX, e.clientY)){ mode2 = 'clock'; return; }
  const p = pickPiece(e.clientX, e.clientY);
  if (p){
    mode2 = 'drag'; dragged = p;
    origin = { f: p.f, r: p.r };
    p.grp.position.y = .42;
    needsRender = true;
  } else {
    mode2 = 'orbit';
  }
});

cv.addEventListener('pointermove', e => {
  if (!mode2 || !downXY) return;
  const dx = e.clientX - downXY.x, dy = e.clientY - downXY.y;
  dragMoved = Math.max(dragMoved, Math.abs(dx) + Math.abs(dy));
  if (mode2 === 'orbit'){
    swipeDX = dx;            // on mesure seulement : la vue saute d'un cote a l'autre
  } else if (dragged){
    const g = boardPoint(e.clientX, e.clientY);
    if (g){
      dragged.grp.position.x = Math.max(-4.6, Math.min(4.6, g.x));
      dragged.grp.position.z = Math.max(-4.6, Math.min(4.6, g.z));
      renderer.shadowMap.needsUpdate = true;   // l'ombre suit la pièce soulevée
      needsRender = true;
    }
  }
});

function endPointer(e){
  if (mode2 === 'clock'){
    if (dragMoved < 9) pressClock();
    mode2 = null; downXY = null; swipeDX = 0;
    return;
  }
  if (mode2 === 'drag' && dragged){
    const g = dragged.grp;
    const f = Math.round(g.position.x + 3.5);
    const r = Math.round(3.5 - g.position.z);
    const inside = f >= 0 && f < 8 && r >= 0 && r < 8;
    if (dragMoved < 9){
      const p = squarePos(dragged.f, dragged.r);
      g.position.set(p.x, 0, p.z);
      if (isDoubleTap('p' + dragged.f + ',' + dragged.r)){
        deselect(); editPiece(dragged);
      } else if (selected && selected !== dragged){
        commitMove(selected, dragged.f, dragged.r); deselect();
      } else if (selected === dragged){
        deselect();
      } else {
        select(dragged);
      }
    } else if (!inside || (f === origin.f && r === origin.r)){
      const p = squarePos(origin.f, origin.r);
      g.position.set(p.x, 0, p.z);
      feltDrop();
    } else {
      deselect();
      commitMove(dragged, f, r);
    }
    shadowsDirty();
  } else if (mode2 === 'orbit'){
    if (Math.abs(swipeDX) > 45){
      turnTo(swipeDX > 0 ? 1 : -1);          // on pousse le plateau, il tourne avec le doigt
    } else if (dragMoved < 9 && downXY){
      const g = boardPoint(downXY.x, downXY.y);
      if (g){
        const f = Math.round(g.x + 3.5), r = Math.round(3.5 - g.z);
        if (f >= 0 && f < 8 && r >= 0 && r < 8){
          if (selected){ commitMove(selected, f, r); deselect(); }
          else if (!pieceAt(f, r) && isDoubleTap('s' + f + ',' + r)) addSheet(f, r);
        }
      }
    }
  }
  swipeDX = 0;
  mode2 = null; dragged = null; downXY = null;
  needsRender = true;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

cv.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist *= 1 + e.deltaY * .0012;
  applyCam();
}, { passive: false });

cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    mode2 = null; swipeDX = 0;
    if (dragged){                       // deux doigts : on repose la piece en cours
      const q = squarePos(dragged.f, dragged.r);
      dragged.grp.position.set(q.x, 0, q.z);
      dragged = null;
    }
    const a = e.touches[0], b = e.touches[1];
    pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: true });

cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    cam.dist *= pinch / Math.max(1, d);
    pinch = d;
    applyCam();
  }
}, { passive: true });

cv.addEventListener('touchend', () => { pinch = null; }, { passive: true });

   JOURNAL ET FEN
   ====================================================================== */
const FILES = 'abcdefgh';
const STD_PLACEMENT = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
function sqName(f, r){ return FILES[f] + (r + 1); }

function boardMap(){
  const m = {};
  pieces.forEach(o => { m[o.f + ',' + o.r] = o; });
  return m;
}
function pathClear(pc, df, dr, map){
  const sf = Math.sign(df), sr = Math.sign(dr);
  const n = Math.max(Math.abs(df), Math.abs(dr));
  for (let i = 1; i < n; i++) if (map[(pc.f + sf * i) + ',' + (pc.r + sr * i)]) return false;
  return true;
}
// Une piece peut-elle atteindre cette case ? Sert uniquement a lever les
// ambiguites du type "lequel des deux cavaliers".
function reaches(pc, tf, tr, map){
  const df = tf - pc.f, dr = tr - pc.r;
  const af = Math.abs(df), ar = Math.abs(dr);
  if (!af && !ar) return false;
  if (pc.type === 'n') return (af === 1 && ar === 2) || (af === 2 && ar === 1);
  if (pc.type === 'k') return af <= 1 && ar <= 1;
  if (pc.type === 'b') return af === ar && pathClear(pc, df, dr, map);
  if (pc.type === 'r') return (!af || !ar) && pathClear(pc, df, dr, map);
  if (pc.type === 'q') return (af === ar || !af || !ar) && pathClear(pc, df, dr, map);
  if (pc.type === 'p'){
    const dir = pc.color === 'w' ? 1 : -1;
    if (!af){
      if (map[tf + ',' + tr]) return false;
      if (dr === dir) return true;
      return dr === 2 * dir && pc.r === (pc.color === 'w' ? 1 : 6) && !map[pc.f + ',' + (pc.r + dir)];
    }
    return af === 1 && dr === dir;
  }
  return false;
}
function san(pc, tf, tr){
  const map = boardMap();
  const capture = !!map[tf + ',' + tr] || (pc.type === 'p' && tf !== pc.f);
  if (pc.type === 'k' && tr === pc.r && Math.abs(tf - pc.f) === 2)
    return tf > pc.f ? 'O-O' : 'O-O-O';
  if (pc.type === 'p')
    return (capture ? FILES[pc.f] + 'x' : '') + sqName(tf, tr);
  const rivals = pieces.filter(o =>
    o !== pc && o.type === pc.type && o.color === pc.color && reaches(o, tf, tr, map));
  let dis = '';
  if (rivals.length){
    if (!rivals.some(o => o.f === pc.f)) dis = FILES[pc.f];
    else if (!rivals.some(o => o.r === pc.r)) dis = String(pc.r + 1);
    else dis = sqName(pc.f, pc.r);
  }
  return pc.type.toUpperCase() + dis + (capture ? 'x' : '') + sqName(tf, tr);
}

function logMove(pc, notation){
  if (pc.color === 'w'){
    if (lastColor !== null) moveNo++;
    journal.push(moveNo + '. ' + notation);
  } else if (lastColor === 'w'){
    journal.push(notation);
  } else {
    if (lastColor !== null) moveNo++;
    journal.push(moveNo + '... ' + notation);   // les noirs reprennent la main
  }
  lastColor = pc.color;
  plyCount++;
  dirtyExport = true;
}
function logEdit(txt){
  journal.push('{' + txt + '}');
  dirtyExport = true;
}

// Annule la derniere action, quelle qu'elle soit, et la retire du journal
// comme du FEN, puisque le FEN est recalcule depuis le plateau a chaque lecture.
function undo(){
  const h = history.pop();
  if (!h){ toast('Rien à annuler'); return; }
  if (h.k === 'move'){
    const p = pieceAt(h.to.f, h.to.r);
    if (p){
      p.f = h.from.f; p.r = h.from.r;
      const q = squarePos(p.f, p.r);
      p.grp.position.set(q.x, 0, q.z);
    }
    if (h.rook){
      const rk = pieceAt(h.rook.to.f, h.rook.to.r);
      if (rk){
        rk.f = h.rook.from.f; rk.r = h.rook.from.r;
        const rq = squarePos(rk.f, rk.r);
        rk.grp.position.set(rq.x, 0, rq.z);
      }
    }
    if (h.cap){ unbury(); addPiece(h.cap.t, h.cap.c, h.cap.f, h.cap.r); }
    if (h.mn !== undefined){ moveNo = h.mn; lastColor = h.lc; }
    plyCount = Math.max(0, plyCount - 1);
  } else if (h.k === 'add'){
    const p = pieceAt(h.at.f, h.at.r); if (p) removePiece(p);
  } else if (h.k === 'remove'){
    addPiece(h.t, h.c, h.at.f, h.at.r);
  } else if (h.k === 'swap'){
    const p = pieceAt(h.at.f, h.at.r); if (p) removePiece(p);
    addPiece(h.t, h.c, h.at.f, h.at.r);
  }
  journal.pop();
  dirtyExport = journal.length > 0;
  shadowsDirty(); persist(); feltDrop();
}

function fen(){
  const grid = [];
  for (let r = 7; r >= 0; r--){
    let row = '', gap = 0;
    for (let f = 0; f < 8; f++){
      const p = pieceAt(f, r);
      if (!p){ gap++; continue; }
      if (gap){ row += gap; gap = 0; }
      row += p.color === 'w' ? p.type.toUpperCase() : p.type;
    }
    if (gap) row += gap;
    grid.push(row);
  }
  return grid.join('/') + ' w - - 0 1';
}

function journalText(){
  const d = new Date();
  const date = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  const start = startFen || fen();
  const custom = start.split(' ')[0] !== STD_PLACEMENT;
  return '[Event "Partie libre"]\n[Site "?"]\n[Date "' + date + '"]\n[Round "-"]\n' +
         '[White "?"]\n[Black "?"]\n[Result "*"]\n' +
         (custom ? '[SetUp "1"]\n[FEN "' + start + '"]\n' : '') + '\n' +
         (journal.length ? journal.join(' ') + ' *' : '*') + '\n';
}

async function copy(text, label){
  try {
    await navigator.clipboard.writeText(text);
    toast(label + ' copié');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(label + ' copié'); }
    catch(e2){ toast('Copie impossible'); }
    document.body.removeChild(ta);
  }
}
/* ======================================================================
   JEU EN LIGNE : repli par lien
   Aucun serveur, aucun tiers. L'etat complet voyage encode dans le fragment
   d'une adresse — la partie apres le # n'est jamais transmise a un serveur,
   meme quand le lien est ouvert. Une position, pas des coups : impossible de
   se desynchroniser durablement.
   ====================================================================== */
function encodePos(){
  const j = JSON.stringify(snapshot());
  return btoa(unescape(encodeURIComponent(j)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodePos(t){
  const b = t.replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b))));
}
function posLink(){
  return location.origin + location.pathname + '#p=' + encodePos();
}

// Applique une position recue et signale ce qui a change.
function adoptPos(st){
  const before = pieces.map(p => ({ t: p.type, c: p.color, f: p.f, r: p.r }));

  // On se place en face de l'expediteur. mySide doit changer AVANT applySnapshot :
  // la mise en place du cimetiere en depend. Les liens anciens n'ont pas de 'from',
  // dans ce cas on ne touche a rien.
  const target = st.from ? other(st.from) : mySide;
  const flipped = target !== mySide;
  mySide = target;

  applySnapshot(st);
  if (flipped) orientSide();          // plateau, cadran et pistons suivent
  litSquares(changedSquares(before, st.pieces));
  persist(false);          // on adopte le numero de l'expediteur, on ne l'incremente pas
  closeSheet();
  toast(flipped
    ? 'Position adoptée — tu joues les ' + (mySide === 'w' ? 'clairs' : 'sombres')
    : 'Position adoptée');
}

// Propose une position recue plutot que de l'appliquer d'office.
function offerPos(st, source){
  const mine = seq, theirs = st.seq || 0;
  let warn = '';
  if (theirs < mine)
    warn = '<p class="note danger">Attention : cette position est plus ancienne ' +
           'que la tienne (n° ' + theirs + ' contre n° ' + mine + '). ' +
           'L\'adopter écrasera tes derniers coups.</p>';
  else if (theirs === mine)
    warn = '<p class="note">Cette position porte le même numéro que la tienne. ' +
           'Vous avez peut-être joué chacun de votre côté.</p>';
  let camp = '';
  if (st.from && other(st.from) !== mySide)
    camp = '<p class="note">Ton adversaire tient les ' +
           (st.from === 'w' ? 'clairs' : 'sombres') + ' : tu passeras donc aux ' +
           (st.from === 'w' ? 'sombres' : 'clairs') + ', et le plateau se retournera.</p>';
  openSheet(
    '<h2>Position reçue</h2>' +
    '<p class="note">' + source + ' — ' + (st.journal ? st.journal.length : 0) +
    ' coup(s) au journal, position n° ' + theirs + '.</p>' + camp + warn +
    '<button class="wide" id="posGo">Adopter cette position</button>' +
    '<button class="wide" id="posNo">Garder la mienne</button>'
  );
  document.getElementById('posGo').onclick = () => adoptPos(st);
  document.getElementById('posNo').onclick = closeSheet;
}

// Extrait la charge utile de n'importe quoi qui contienne #p=
function payloadOf(txt){
  const i = txt.indexOf('#p=');
  return (i >= 0 ? txt.slice(i + 3) : txt).trim().replace(/\s+/g, '');
}

// La ligne du haut : le presse-papiers a gauche, le maillon a droite.
document.getElementById('netCopy').onclick = () => {
  copy(posLink(), 'Lien (position n° ' + seq + ')');
};

// Tente de lire une position ; renvoie false si le texte n'en contient pas.
function tryPos(raw, source){
  if (!raw || !raw.trim()) return false;
  let st = null;
  try { st = decodePos(payloadOf(raw)); } catch(e){ return false; }
  if (!st || !st.pieces) return false;
  offerPos(st, source);
  return true;
}

// Repli quand le navigateur refuse de donner le presse-papiers : on demande
// un collage a la main. C'est le cas sur certaines configurations iOS.
function pasteFallback(){
  openSheet(
    '<h2>Coller le lien</h2>' +
    '<p class="note">Ton navigateur n\'autorise pas la lecture directe du ' +
    'presse-papiers. Colle le lien ici.</p>' +
    '<textarea id="pIn" rows="3" style="width:100%;box-sizing:border-box;' +
    'font-size:15px;padding:8px;border-radius:8px;border:1px solid #5a4a38;' +
    'background:#241c15;color:#e8d6b0"></textarea>' +
    '<button class="wide" id="pGo">Lire cette position</button>'
  );
  const ta = document.getElementById('pIn');
  setTimeout(() => ta.focus(), 60);
  const go = () => { if (!tryPos(ta.value, 'Collée à la main')) toast('Lien illisible'); };
  document.getElementById('pGo').onclick = go;
  ta.addEventListener('input', () => { if (ta.value.indexOf('#p=') >= 0) go(); });
}

document.getElementById('netPaste').onclick = async () => {
  let txt = null;
  try {
    txt = await navigator.clipboard.readText();
  } catch(e){
    return pasteFallback();       // refus, absence de permission, ou API absente
  }
  if (!txt || !txt.trim()) return toast('Presse-papiers vide');
  if (!tryPos(txt, 'Collée depuis le presse-papiers'))
    toast('Le presse-papiers ne contient pas de position');
};

// Position arrivee par l'adresse elle-meme, a l'ouverture.
function readIncomingLink(){
  const h = location.hash;
  if (h.indexOf('#p=') !== 0) return;
  // on nettoie l'adresse tout de suite, pour ne pas re-proposer a chaque reouverture
  window.history.replaceState(null, '', location.pathname + location.search);
  let st = null;
  try { st = decodePos(h.slice(3)); } catch(e){ return toast('Lien reçu illisible'); }
  if (!st || !st.pieces) return toast('Lien reçu illisible');
  offerPos(st, 'Reçue par lien');
}

async function shareJournal(){
  const text = journalText();
  if (navigator.share){
    try {
      await navigator.share({ title: 'Partie', text });
      dirtyExport = false; persist();
      return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  await copy(text, 'Journal');
  dirtyExport = false; persist();
}

   ====================================================================== */
const sheet = document.getElementById('sheet');
const veil = document.getElementById('veil');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}
function openSheet(html){
  sheet.innerHTML = html;
  sheet.classList.add('open');
  veil.classList.add('open');
}
function closeSheet(){
  sheet.classList.remove('open');
  veil.classList.remove('open');
}
veil.addEventListener('click', closeSheet);

function editPiece(p){
  const natures = ORDER.map(t =>
    '<button data-t="' + t + '" class="' + (t === p.type ? 'on' : '') + '">' + NAMES[t] + '</button>').join('');
  openSheet(
    '<h2>' + NAMES[p.type] + ' en ' + sqName(p.f, p.r) + '</h2>' +
    '<p class="note">Change sa nature ou son camp, ou retire-la du plateau.</p>' +
    '<div class="grp">Nature</div><div class="g3" id="nat">' + natures + '</div>' +
    '<div class="grp">Camp</div><div class="g2" id="col">' +
      '<button data-c="w" class="' + (p.color === 'w' ? 'on' : '') + '">Clair</button>' +
      '<button data-c="b" class="' + (p.color === 'b' ? 'on' : '') + '">Sombre</button>' +
    '</div>' +
    '<button class="wide danger" id="del">Retirer du plateau</button>' +
    '<button class="wide" id="close">Fermer</button>'
  );
  sheet.querySelectorAll('#nat button').forEach(b => b.onclick = () => {
    swap(p, b.dataset.t, p.color); closeSheet();
  });
  sheet.querySelectorAll('#col button').forEach(b => b.onclick = () => {
    swap(p, p.type, b.dataset.c); closeSheet();
  });
  sheet.querySelector('#del').onclick = () => {
    logEdit(NAMES[p.type] + ' retire de ' + sqName(p.f, p.r));
    history.push({ k:'remove', t: p.type, c: p.color, at:{ f: p.f, r: p.r } });
    removePiece(p); shadowsDirty(); persist(); closeSheet(); feltDrop();
  };
  sheet.querySelector('#close').onclick = closeSheet;
}

function swap(p, type, color){
  if (type === p.type && color === p.color) return;
  const f = p.f, r = p.r;
  logEdit(NAMES[p.type] + ' en ' + sqName(f, r) + ' devient ' + NAMES[type] + ' ' + (color === 'w' ? 'clair' : 'sombre'));
  history.push({ k:'swap', t: p.type, c: p.color, at:{ f: f, r: r } });
  removePiece(p);
  addPiece(type, color, f, r);
  shadowsDirty(); persist(); feltDrop();
}

let addColor = 'w';
function addSheet(f, r){
  const natures = ORDER.map(t => '<button data-t="' + t + '">' + NAMES[t] + '</button>').join('');
  openSheet(
    '<h2>Case ' + sqName(f, r) + '</h2>' +
    '<p class="note">Choisis le camp, puis la pièce à poser ici.</p>' +
    '<div class="grp">Camp</div><div class="g2" id="col">' +
      '<button data-c="w" class="' + (addColor === 'w' ? 'on' : '') + '">Clair</button>' +
      '<button data-c="b" class="' + (addColor === 'b' ? 'on' : '') + '">Sombre</button>' +
    '</div>' +
    '<div class="grp">Pièce</div><div class="g3" id="nat">' + natures + '</div>' +
    '<button class="wide" id="close">Fermer</button>'
  );
  sheet.querySelectorAll('#col button').forEach(b => b.onclick = () => {
    addColor = b.dataset.c;
    sheet.querySelectorAll('#col button').forEach(x => x.classList.toggle('on', x.dataset.c === addColor));
  });
  sheet.querySelectorAll('#nat button').forEach(b => b.onclick = () => {
    addPiece(b.dataset.t, addColor, f, r);
    history.push({ k:'add', at:{ f: f, r: r } });
    logEdit(NAMES[b.dataset.t] + ' ' + (addColor === 'w' ? 'clair' : 'sombre') + ' pose en ' + sqName(f, r));
    shadowsDirty(); persist(); feltDrop(); closeSheet();
  });
  sheet.querySelector('#close').onclick = closeSheet;
}

function settingsSheet(){
  openSheet(
    '<h2>Réglages</h2><p class="note">Tout est conservé d\'une session à l\'autre.</p>' +
    '<div class="grp">Sons</div>' +
    '<div class="row"><span>Mer</span><span class="val" id="vSea">' + settings.sea + '</span></div>' +
    '<input type="range" id="sSea" min="0" max="100" value="' + settings.sea + '" style="width:100%">' +
    '<div class="row"><span>Pièces</span><span class="val" id="vFx">' + settings.fx + '</span></div>' +
    '<input type="range" id="sFx" min="0" max="100" value="' + settings.fx + '" style="width:100%">' +
    '<button class="wide" id="test">Tester le son</button>' +
    '<label class="check"><input type="checkbox" id="cSwell"' + (settings.swell ? ' checked' : '') + '> Houle lente</label>' +
    '<div class="grp">Mon camp</div>' +
    '<div class="g3" id="sideSel">' +
      '<button data-s="w" class="' + (settings.side === 'w' ? 'on' : '') + '">Clairs</button>' +
      '<button data-s="b" class="' + (settings.side === 'b' ? 'on' : '') + '">Sombres</button>' +
      '<button data-s="random" class="' + (settings.side === 'random' ? 'on' : '') + '">Au hasard</button>' +
    '</div>' +
    '<div class="grp">Horloge</div>' +
    '<div class="g3">' +
      '<label class="tm">Heures<input type="number" id="ckH" inputmode="numeric" min="0" max="9" value="' + settings.clock.h + '"></label>' +
      '<label class="tm">Minutes<input type="number" id="ckM" inputmode="numeric" min="0" max="59" value="' + settings.clock.m + '"></label>' +
      '<label class="tm">Secondes<input type="number" id="ckS" inputmode="numeric" min="0" max="59" value="' + settings.clock.s + '"></label>' +
    '</div>' +
    '<button class="wide" id="ckSet">Appliquer et remettre à zéro</button>' +
    '<button class="wide" id="ckPause">Mettre en pause</button>' +
    '<div class="grp">Vue</div>' +
    '<button class="wide" id="reset">Revenir au côté clair et au cadrage d\'origine</button>' +
    '<div class="grp">Partie</div>' +
    '<button class="wide danger" id="newg">Nouvelle partie</button>' +
    '<button class="wide" id="close">Fermer</button>'
  );
  const bindVol = (id, out, key, bus) => {
    const el = sheet.querySelector('#' + id);
    el.oninput = () => {
      settings[key] = +el.value;
      sheet.querySelector('#' + out).textContent = el.value;
      if (ctx && bus()) bus().gain.setTargetAtTime(el.value / 100, ctx.currentTime, .05);
      if (key === 'sea' && +el.value > 0 && !seaOn) startSea();
      persist();
    };
  };
  bindVol('sSea', 'vSea', 'sea', () => seaBus);
  bindVol('sFx', 'vFx', 'fx', () => fxBus);
  sheet.querySelector('#test').onclick = () => {
    boot();
    if (!seaOn && settings.sea > 0) startSea();
    feltDrop();
    setTimeout(() => {
      if (!ctx) toast('Moteur audio indisponible');
      else if (ctx.state !== 'running') toast('Son bloqué par le système');
      else if (settings.fx === 0) toast('Volume des pièces à zéro');
      else toast('Son actif — vérifie l\'interrupteur de sourdine');
    }, 260);
  };
  sheet.querySelector('#cSwell').onchange = e => { settings.swell = e.target.checked; persist(); };
  sheet.querySelectorAll('#sideSel button').forEach(b => b.onclick = () => {
    settings.side = b.dataset.s;
    sheet.querySelectorAll('#sideSel button')
      .forEach(x => x.classList.toggle('on', x.dataset.s === settings.side));

  });
  sheet.querySelector('#ckSet').onclick = () => {
    const rd = (id, max) => Math.max(0, Math.min(max, parseInt(sheet.querySelector(id).value, 10) || 0));
    settings.clock = { h: rd('#ckH', 9), m: rd('#ckM', 59), s: rd('#ckS', 59) };
    if (clockTotalMs() === 0) settings.clock.m = 10;
    resetClock(); clockTick(performance.now(), true); persist(); closeSheet();
    toast('Horloge remise à ' + fmt(clockTotalMs()));
  };
  sheet.querySelector('#ckPause').onclick = () => {
    pauseClock(); clockTick(performance.now(), true); persist(); closeSheet();
    toast('Horloge en pause');
  };
  sheet.querySelector('#reset').onclick = () => {
    cam.side = 0; board.rotation.y = 0; cam.dist = cam.def;
    applyCam(); shadowsDirty(); closeSheet();
  };
  sheet.querySelector('#newg').onclick = () => { closeSheet(); askNewGame(); };
  sheet.querySelector('#close').onclick = closeSheet;
}

function logSheet(){
  const body = journal.length
    ? journal.join(' ')
    : '<span class="empty">Aucun coup joué pour l\'instant.</span>';
  openSheet(
    '<h2>Journal</h2>' +
    '<p class="note">Notation longue. Le journal repart à zéro à chaque nouvelle partie.</p>' +
    '<div class="grp">Coups</div><div class="log">' + body + '</div>' +
    '<div class="grp">Position actuelle</div><div class="log">' + fen() + '</div>' +
    '<button class="wide" id="cpFen">Copier le FEN</button>' +
    '<button class="wide" id="exp">Exporter le journal</button>' +
    '<button class="wide" id="close">Fermer</button>'
  );
  sheet.querySelector('#cpFen').onclick = () => copy(fen(), 'FEN');
  sheet.querySelector('#exp').onclick = () => { shareJournal(); banner(false); };

}

/* ======================================================================
   BANNIÈRE ET PERSISTANCE
   ====================================================================== */
const bannerEl = document.getElementById('banner');
function banner(show, txt){
  bannerEl.classList.toggle('show', !!show);
  if (txt) document.getElementById('bannerTxt').textContent = txt;
}
document.getElementById('bannerGo').onclick = () => { shareJournal(); banner(false); };
document.getElementById('bannerNo').onclick = () => banner(false);

/* ======================================================================
   ETAT PARTAGEABLE
   Tout ce qui decrit la partie, et rien de ce qui decrit les gouts du joueur :
   lanterne, son et cadrage restent strictement locaux. Seule exception, le
   camp : l'expediteur declare le sien dans 'from', et le destinataire prend
   automatiquement l'autre — deux joueurs ne peuvent pas tenir les memes
   pieces. Le numero d'ordre 'seq' croit a chaque modification du plateau ;
   c'est lui qui tranche en cas de conflit.
   ====================================================================== */
let seq = 0;

function snapshot(){
  return {
    v: 1, seq,
    from: mySide,          // le camp de l'expediteur : le destinataire prend l'autre
    pieces: pieces.map(p => ({ t: p.type, c: p.color, f: p.f, r: p.r })),
    journal, plyCount, dirtyExport, moveNo, lastColor, startFen,
    grave: captured.map(e => ({ t: e.type, c: e.color })),
    clock: { w: remaining('w'), b: remaining('b'), active: clockState.active }
  };
}

// Remplace la partie en cours. 'history' n'est volontairement pas transporte :
// la pile d'annulation de l'adversaire n'a aucun sens de ce cote-ci.
function applySnapshot(st){
  clearBoard();
  st.pieces.forEach(p => addPiece(p.t, p.c, p.f, p.r));
  journal = st.journal || [];
  history = [];
  moveNo = st.moveNo || 1;
  lastColor = st.lastColor === undefined ? null : st.lastColor;
  startFen = st.startFen || null;
  plyCount = st.plyCount || 0;
  dirtyExport = !!st.dirtyExport;
  restoreGrave(st.grave);
  if (st.clock){
    clockState.w = st.clock.w; clockState.b = st.clock.b;
    clockState.active = st.clock.active || null;
    clockState.since = Date.now();
  }
  seq = st.seq || 0;
  shadowsDirty(); refreshCheck();
}

// Les cases dont l'occupant a change entre deux etats.
function changedSquares(before, after){
  const key = a => { const m = {}; a.forEach(x => { m[x.f + ',' + x.r] = x.t + x.c; }); return m; };
  const A = key(before), B = key(after), out = [];
  Object.keys(A).forEach(k => { if (A[k] !== B[k]) out.push(k); });
  Object.keys(B).forEach(k => { if (A[k] === undefined) out.push(k); });
  return out;
}

let saveTimer = null;
function persist(bump){
  refreshCheck();
  if (bump !== false) seq++;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store.set('chess:settings', settings);
    store.set('chess:state', Object.assign(snapshot(), { mySide, history }));
  }, 260);
}

async function restore(){
  const s = await store.get('chess:settings');
  if (s) Object.assign(settings, s);
  if (!settings.clock) settings.clock = { h:0, m:10, s:0 };
  if (!settings.side) settings.side = 'w';
  resetClock();
  document.getElementById('lampSlider').value = settings.lamp;
  applyLamp();

  const st = await store.get('chess:state');
  if (st && st.pieces && st.pieces.length){
    // mySide d'abord : la mise en place du cimetiere en depend
    mySide = st.mySide || (settings.side === 'random' ? 'w' : settings.side);
    applySnapshot(st);
    history = st.history || [];
    if (dirtyExport && journal.length)
      banner(true, 'Partie précédente non exportée');
  } else {
    standardSetup();
  }
  shadowsDirty(); refreshCheck();
}

/* ======================================================================
   BOUTONS
   ====================================================================== */
function applyLamp(){
  const v = settings.lamp / 100;
  lantern.intensity = .12 + Math.pow(v, 1.5) * 3.4;
  fill.intensity = .04 + v * .34;
  moon.intensity = .40 - v * .13;   // plus la lanterne monte, moins la lune compte
  renderer.toneMappingExposure = 1.14 - v * .16;
  needsRender = true;
}
document.getElementById('lampSlider').oninput = e => {
  settings.lamp = +e.target.value;
  applyLamp(); persist();
};
document.getElementById('bTurn').onclick = quarterTurn;
document.getElementById('bLog').onclick = logSheet;
document.getElementById('bSet').onclick = settingsSheet;
document.getElementById('bUndo').onclick = undo;
function askNewGame(){
  if (journal.length && dirtyExport){
    openSheet(
      '<h2>Nouvelle partie</h2>' +
      '<p class="note">La partie en cours n\'a pas été exportée. Le journal sera effacé.</p>' +
      '<button class="wide" id="expFirst">Exporter d\'abord</button>' +
      '<button class="wide danger" id="go">Effacer et recommencer</button>' +
      '<button class="wide" id="close">Annuler</button>'
    );
    sheet.querySelector('#expFirst').onclick = async () => { await shareJournal(); };
    sheet.querySelector('#go').onclick = () => { newGame(); closeSheet(); };
    sheet.querySelector('#close').onclick = closeSheet;
  } else {
    newGame();
  }
}
function newGame(){
  deselect();
  clearGrave();
  standardSetup();
  journal = []; history = []; plyCount = 0; dirtyExport = false;
  moveNo = 1; lastColor = null; startFen = fen();
  resetClock();
  applySide(settings.side === 'random');
  banner(false);
  shadowsDirty(); persist(); feltDrop();
}

/* ======================================================================
   BOUCLE
   ====================================================================== */
let needsRender = true;
function shadowsDirty(){ renderer.shadowMap.needsUpdate = true; needsRender = true; }

function tick(now){
  if (turning){
    const k = Math.min(1, (now - turning.t0) / 560);
    const e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    board.rotation.y = turning.from + (turning.to - turning.from) * e;
    renderer.shadowMap.needsUpdate = true;   // les ombres suivent le plateau
    if (k >= 1){ board.rotation.y = turning.to; turning = null; }
    needsRender = true;
  }
  clockTick(now);
  if (stepFlights(now)){ renderer.shadowMap.needsUpdate = true; needsRender = true; }
  if (needsRender){
    renderer.render(scene, camera);
    needsRender = false;
  }
  requestAnimationFrame(tick);
}

resize();
drawClockFace(performance.now());
restore().then(() => { orientSide(); readIncomingLink(); });
requestAnimationFrame(tick);
}
</script>
